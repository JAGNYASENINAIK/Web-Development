<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM projects4</title>
</head>

<body>

  <p>YouTube Subscribe Button</p>
  <button onclick="sub()" class="js-sub-button">Subscribe</button>


  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40 = +$10 shipping.</p>
  <p>Orders over $40 = FREE shipping.</p>
  <input type="number" placeholder="Cost of order" class="js-cost"
  onkeydown="handelCostKeydown(event)"> 
  <button 
  onclick=" calTotal()">Calculate</button>
  <p class="js-tcost"></p>

  <script>

    function handelCostKeydown(event){
   
  if(event.key==='Enter'){
 calTotal();
  }
    }


function calTotal(){
const inputElement=document.querySelector('.js-cost')
let cost= Number(inputElement.value)*100;

if(cost <=4000){
  cost+=1000
}

document.querySelector('.js-tcost').innerHTML=`total cost is $${cost/100}`
}




  function sub(){
  const butel=document.querySelector('.js-sub-button') ;
if( butel.innerText==='Subscribe'){
  butel.innerText='Subscribed'
}else{
  butel.innerText='Subscribe'
}

  }

  </script>
</body>

</html>
