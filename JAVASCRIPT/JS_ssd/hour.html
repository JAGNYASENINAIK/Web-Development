<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIME</title>
</head>
<body>
  <script>
    let hour=6;
    const name='reenu'
    if(hour<=12 && hour>=6){
      console.log(`good morning ${name}`);
    }else if(hour <=17 && hour >=13){
      console.log(`good afternoon ${name}`)
    }else{
      console.log(`good night ${name}`)
    }
  </script>
</body>
</html>
