<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>exr</title>
</head>
<body>
  <button class="btn-a" onclick=" document.querySelector('.result')
        .innerHTML = 'You chose:Heads';">Heads</button>
  <button class="btn-b" onclick="document.querySelector('.result')
        .innerHTML = 'You chose: Tails';">Tails</button>
  <p class="result"></p>

  <input type="text" class="wrt" placeholder="write your name " onkeydown="if(event.key==='Enter'){
    display()}" onkeyup="display()">
  <button onclick="display()
  "  >Submit</button>
  <p class="dis"></p>
    <script>
   function display(){
    
 const inputElement=document.querySelector('.wrt')
  document.querySelector('.dis')
        .innerHTML =`Your Name is ${inputElement.value} `
   }

  </script>
</body>
</html>
