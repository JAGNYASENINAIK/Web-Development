    <div class="container my-4">
        <h2 class="text-center">TODOs List</h2>

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" class="form-control" id="title" aria-describedby="emailHelp">
            <small id="emailHelp" class="form-text text-muted">Add an item to the list</small>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" rows="3"></textarea>
        </div>
        <button type="submit" id="add" class="btn btn-primary">Add to list</button>

        <div id="items" class="my-4">
            <h2>Your Items</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">SNo</th>
                        <th scope="col">Item Title</th>
                        <th scope="col">Item Description</th>
                        <th scope="col">Actions</th>

                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <th scope="row">1</th>
                        <td>Get some fruits</td>
                        <td>as you do not have any fruits in your house</td>
                        <td><button class="btn btn-primary">Delete</button></td>
                    </tr>

                </tbody>
            </table>

        </div>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"

        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>

    <script>
        add = document.getElementById("add");
        add.addEventListener("click", () => {
            console.log("Updating List .....");
            tit = document.getElementById('title').value;
            desc = document.getElementById('description').value;
            if (localStorage.getItem('itemJson') == null) {
                itemJsonArray = [];
                itemJsonArray.push([tit,desc]);
                localStorage.setItem('itemJson',JSON.stringify(itemJsonArray))
            }
            else {
                itemJsonArray = localStorage.getItem('itemJson');
                itemJsonArray = JSON.parse(itemJsonArray);
                itemJsonArray.push([tit, desc]);
                localStorage.setItem('itemJson', JSON.stringify(itemJsonArray));
            }

            //popilate the table
            tableBody = document.getElementById("tableBody");
            str = "";
            itemJsonArray.forEach((element,index) => {
                str += `
                        <tr>
                        <th scope="row">${index + 1}</th>
                        <td>${element[0]}</td>
                        <td>${element[1]}</td>
                        <td><button class="btn btn-primary" onclick="delete(4)">Delete</button></td>
                        </tr>
                        `
            });
            tableBody.innerHTML = str;

        })
        add = document.getElementById("add");
        add.addEventListener("click",update);
        update();
        function deleted(item) {
            console.log("delete",item)
            
        }
    </script>
